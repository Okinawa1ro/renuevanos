<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6f7f5a">
<title>Tienda</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="legal.css">
<style>
:root{
  --bg:#f6f1e4;        /* fondo crema cálido */
  --surface:#fffdf7;
  --ink:#2c302a;        /* texto principal */
  --soft:#7a7c6e;       /* texto secundario */
  --line:#e6e1d0;
  --clay:#6f7f5a;       /* verde tallo / oliva (color principal) */
  --clay-dk:#54643f;    /* verde más oscuro */
  --sage:#869471;       /* verde salvia (secundario) */
  --gold:#c2a662;
  --ok:#3a8a52;
  --danger:#c0492f;
  --r:18px;
  --shadow:0 6px 24px rgba(60,40,20,.08);
  --shadow-lg:0 14px 40px rgba(60,40,20,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Nunito',system-ui,sans-serif;font-size:17px;line-height:1.5;
  overflow-x:hidden;-webkit-text-size-adjust:100%;
}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.serif{font-family:'Cormorant Garamond',Georgia,serif;}

/* ── LAYOUT ── */
.wrap{max-width:1100px;margin:0 auto;padding:0 20px;}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:40;background:rgba(250,246,240,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;max-width:1100px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-logo{width:42px;height:42px;flex-shrink:0;}
.brand-text{display:flex;flex-direction:column;line-height:1.05;}
.brand b{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;color:var(--clay-dk);letter-spacing:.3px;}
.brand span{font-size:12px;color:var(--soft);letter-spacing:.5px;}
.cart-btn{
  display:flex;align-items:center;gap:8px;background:var(--clay);color:#fff;
  font-weight:800;font-size:16px;padding:12px 18px;border-radius:50px;
  box-shadow:var(--shadow);transition:transform .15s,background .2s;
}
.cart-btn:active{transform:scale(.95);}
.cart-btn .count{
  background:#fff;color:var(--clay);min-width:24px;height:24px;border-radius:50px;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;padding:0 6px;
}

/* ── HERO ── */
.hero{padding:38px 0 30px;text-align:center;}
.hero-logo{width:min(260px,66%);height:auto;margin:0 auto 6px;display:block;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,7vw,56px);font-weight:700;color:var(--ink);line-height:1.05;}
.hero p{color:var(--soft);font-size:18px;margin-top:12px;max-width:560px;margin-left:auto;margin-right:auto;}
.hero .ship{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:50px;padding:9px 18px;font-size:14px;color:var(--sage);font-weight:700;box-shadow:var(--shadow);}
.hero .iva-note{margin-top:12px;font-size:13px;color:var(--soft);font-weight:600;}

/* ── CATEGORÍAS ── */
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 20px 18px;scrollbar-width:none;max-width:1100px;margin:0 auto;}
.cats::-webkit-scrollbar{display:none;}
.cat{
  flex-shrink:0;display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1.5px solid var(--line);border-radius:50px;
  padding:11px 18px;font-weight:700;font-size:15px;color:var(--soft);transition:.18s;white-space:nowrap;
}
.cat .em{font-size:18px;}
.cat:active{transform:scale(.96);}
.cat.on{background:var(--clay);border-color:var(--clay);color:#fff;box-shadow:var(--shadow);}

/* ── GRID DE PRODUCTOS ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;padding:14px 0 60px;}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:12px;}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .2s;cursor:pointer;
}
.card:active{transform:scale(.985);}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}}
.thumb{aspect-ratio:1/1;position:relative;overflow:hidden;}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:54px;}
.badge{position:absolute;top:10px;left:10px;background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:50px;letter-spacing:.4px;text-transform:uppercase;box-shadow:var(--shadow);}
.badge.out{background:#5b5048;}
.card-body{padding:13px 14px 15px;display:flex;flex-direction:column;flex:1;}
.card-cat{font-size:11px;font-weight:800;color:var(--clay);text-transform:uppercase;letter-spacing:.6px;}
.card-name{font-size:16px;font-weight:700;margin:4px 0 6px;line-height:1.25;}
.card-price{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--ink);margin-top:auto;}
.add{
  margin-top:11px;background:var(--clay);color:#fff;font-weight:800;font-size:15px;
  padding:12px;border-radius:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s;
}
.add:active{transform:scale(.97);background:var(--clay-dk);}
.add.disabled{background:#cfc6bb;color:#fff;pointer-events:none;}

.empty{text-align:center;padding:70px 20px;color:var(--soft);}
.empty .em{font-size:50px;}

/* ── OVERLAY + PANELES ── */
.overlay{position:fixed;inset:0;background:rgba(40,28,18,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);}
.overlay.show{opacity:1;pointer-events:auto;}

/* Carrito (panel lateral) */
.panel{
  position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--bg);
  z-index:60;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
}
.panel.show{transform:translateX(0);}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--line);}
.panel-head h2{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;}
.x{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:22px;color:var(--soft);display:flex;align-items:center;justify-content:center;}
.x:active{transform:scale(.92);}
.panel-body{flex:1;overflow-y:auto;padding:16px 20px;}
.panel-foot{padding:18px 20px 24px;border-top:1px solid var(--line);background:var(--surface);}

/* Item del carrito */
.ci{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center;}
.ci-thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:30px;border:1px solid var(--line);}
.ci-thumb img{width:100%;height:100%;object-fit:cover;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-weight:700;font-size:15px;line-height:1.2;}
.ci-price{color:var(--soft);font-size:14px;margin-top:2px;}
.qty{display:flex;align-items:center;gap:0;margin-top:8px;border:1.5px solid var(--line);border-radius:50px;width:fit-content;overflow:hidden;}
.qty button{width:34px;height:34px;font-size:20px;font-weight:800;color:var(--clay);display:flex;align-items:center;justify-content:center;}
.qty button:active{background:var(--line);}
.qty span{min-width:34px;text-align:center;font-weight:800;font-size:16px;}
.ci-remove{font-size:13px;color:var(--danger);font-weight:700;margin-top:6px;}

.totrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.totrow .lbl{font-size:16px;color:var(--soft);font-weight:700;}
.totrow .val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:var(--clay-dk);}
.btn{
  width:100%;padding:17px;border-radius:14px;font-size:18px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:.15s;text-decoration:none;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--clay);color:#fff;box-shadow:var(--shadow);}
.btn-primary:active{background:var(--clay-dk);}
.btn-wa{background:#25d366;color:#fff;}
.btn-mp{background:#009ee3;color:#fff;}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
.btn + .btn{margin-top:10px;}

.cart-empty{text-align:center;padding:60px 10px;color:var(--soft);}
.cart-empty .em{font-size:54px;}

/* ── DETALLE DE PRODUCTO (modal) ── */
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;visibility:hidden;transition:visibility 0s linear .3s;
}
.modal.show{visibility:visible;transition-delay:0s;}
.modal:not(.show) .sheet{pointer-events:none;}
@media(min-width:560px){.modal{align-items:center;}}
.sheet{
  background:var(--bg);width:min(560px,100%);max-height:92vh;overflow-y:auto;
  border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  pointer-events:auto;box-shadow:var(--shadow-lg);
}
@media(min-width:560px){.sheet{border-radius:24px;transform:translateY(20px);opacity:0;transition:transform .3s,opacity .3s;}}
.modal.show .sheet{transform:translateY(0);opacity:1;}
.sheet-img{width:100%;min-height:240px;max-height:62vh;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:90px;position:relative;}
.sheet-img img{max-width:100%;max-height:62vh;width:auto;height:auto;object-fit:contain;}
.sheet-x{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.92);}
.sheet-body{padding:22px 22px 26px;}
.sheet-body .card-cat{font-size:12px;}
.sheet-body h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;margin:6px 0 4px;line-height:1.1;}
.sheet-price{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:var(--clay-dk);margin:8px 0 14px;}
.sheet-desc{color:var(--soft);font-size:16px;line-height:1.6;margin-bottom:18px;}
.iva-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--sage);background:rgba(111,127,90,.1);border-radius:50px;padding:4px 12px;margin:-6px 0 14px;}
.unica-tag{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#a9863f;}
.card-body .unica-tag{display:block;margin:2px 0 4px;}
.prod-legal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;font-size:14px;line-height:1.55;color:var(--soft);}
.prod-legal>div{margin-bottom:7px;}
.prod-legal>div:last-child{margin-bottom:0;}
.prod-legal b{color:var(--ink);font-weight:700;}
.prod-legal a{color:var(--clay-dk);font-weight:700;}
/* Confirmación de compra */
.confirm{text-align:center;padding:6px 0 4px;}
.confirm-ic{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:6px auto 14px;}
.confirm h3{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;margin-bottom:6px;}
.confirm p{color:var(--soft);font-size:15px;margin-bottom:14px;}
.confirm-num{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:15px;margin-bottom:16px;}
.confirm-num b{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--clay-dk);}
.confirm .note{text-align:left;}
.confirm-vendor{font-size:14px;color:var(--soft);margin:14px 0;line-height:1.6;}
.confirm-vendor a{color:var(--clay-dk);font-weight:700;text-decoration:none;}

/* ── CHECKOUT ── */
.field{margin-bottom:14px;}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:6px;}
.field input,.field textarea{
  width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;
  font-family:inherit;font-size:16px;background:var(--surface);color:var(--ink);
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--clay);}
.field textarea{resize:vertical;min-height:64px;}
.pay-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;margin:22px 0 6px;}
.pay-sub{color:var(--soft);font-size:14px;margin-bottom:14px;}
.ship-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.ship-opt{display:flex;align-items:center;gap:10px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:.15s;}
.ship-opt.on{border-color:var(--clay);background:rgba(111,127,90,.08);}
.ship-opt input{width:20px;height:20px;accent-color:var(--clay);flex-shrink:0;}
.ship-opt .ship-name{flex:1;font-weight:700;font-size:15px;}
.ship-opt .ship-cost{font-weight:800;color:var(--clay-dk);white-space:nowrap;}
.totbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:6px;}
.totline{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:15px;color:var(--soft);}
.totline.grand{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
.totline.grand span:first-child{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--ink);}
.totline.grand span:last-child{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--clay-dk);}
.totline.grand small{font-size:13px;color:var(--soft);font-family:'Nunito',sans-serif;font-weight:600;}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:15px;color:var(--soft);margin-top:14px;line-height:1.55;}
.note b{color:var(--ink);}
.note .copy{margin-top:6px;display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:800;color:var(--clay-dk);font-size:15px;}

/* ── TOAST ── */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);
  background:var(--ink);color:#fff;padding:14px 22px;border-radius:50px;font-weight:700;font-size:15px;
  z-index:90;box-shadow:var(--shadow-lg);transition:transform .3s;display:flex;align-items:center;gap:8px;max-width:90%;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ── FOOTER ── */
footer{border-top:1px solid var(--line);padding:34px 20px 44px;text-align:center;color:var(--soft);font-size:14px;}
footer a{color:var(--clay-dk);font-weight:700;text-decoration:none;}
footer .fbrand{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--clay-dk);font-weight:700;margin-bottom:6px;}
footer .privacy{max-width:560px;margin:18px auto 0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
footer .privacy summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:700;color:var(--clay-dk);text-align:center;font-size:15px;}
footer .privacy summary::-webkit-details-marker{display:none;}
footer .privacy[open] summary{border-bottom:1px solid var(--line);}
footer .privacy-body{padding:16px 18px;font-size:14px;line-height:1.6;color:var(--soft);}
footer .privacy-body b{color:var(--ink);}
footer .privacy-body ul{margin:8px 0 0;padding-left:18px;}
footer .privacy-body li{margin-bottom:6px;}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand" onclick="scrollTop()">
      <img class="brand-logo" src="logo-mini.png" alt="">
      <div class="brand-text">
        <b id="brandName">Tienda</b>
        <span id="brandSlogan"></span>
      </div>
    </div>
    <button class="cart-btn" onclick="openCart()" aria-label="Ver carrito">
      🛒 Carrito <span class="count" id="cartCount">0</span>
    </button>
  </div>
</header>

<main>
  <section class="hero wrap">
    <img class="hero-logo" src="logo.png" alt="Proyecto ReNuevaNos — Creciendo en el amor">
    <h1 id="heroTitle" class="sr-only">Tienda</h1>
    <p id="heroText" class="sr-only"></p>
    <div class="ship" id="shipBox">🚚 <span id="shipText"></span></div>
    <p class="iva-note">Todos los precios publicados son finales</p>
  </section>

  <div class="cats" id="cats"></div>

  <div class="wrap">
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  <div class="fbrand" id="footBrand">Tienda</div>
  <div id="footContact"></div>
  <div class="pie-legal" id="pie-legal"></div>
  <div style="margin-top:18px;font-size:13px;opacity:.8;">Hecho con cariño · Compra fácil y segura</div>
</footer>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- Carrito -->
<aside class="panel" id="cartPanel" aria-label="Carrito de compras">
  <div class="panel-head">
    <h2>Tu carrito</h2>
    <button class="x" onclick="closeAll()" aria-label="Cerrar">✕</button>
  </div>
  <div class="panel-body" id="cartBody"></div>
  <div class="panel-foot" id="cartFoot"></div>
</aside>

<!-- Detalle de producto -->
<div class="modal" id="prodModal">
  <div class="sheet" id="prodSheet"></div>
</div>

<!-- Checkout -->
<aside class="panel" id="checkoutPanel" aria-label="Finalizar compra">
  <div class="panel-head">
    <button class="x" onclick="openCart()" aria-label="Volver">‹</button>
    <h2>Tus datos</h2>
    <button class="x" onclick="closeAll()" aria-label="Cerrar">✕</button>
  </div>
  <div class="panel-body" id="checkoutBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script src="productos.js"></script>
<script src="pie-legal.js"></script>
<script>
/* ============================ ESTADO ============================ */
let cart = {};           // { idProducto: cantidad }
let activeCat = "todos";
let selectedShip = 0;    // opción de envío elegida en el checkout

try { cart = JSON.parse(localStorage.getItem("cart")||"{}"); } catch(e){ cart = {}; }

const money = n => CONFIG.moneda + " " + Number(n).toLocaleString("es-AR");
const hasPrice   = p => typeof p.precio === "number" && p.precio > 0;
const priceLabel = p => hasPrice(p) ? money(p.precio) : "Consultar";
const soldOut    = p => !!(p.vendida || p.agotado);
const byId  = id => PRODUCTOS.find(p => p.id == id);
const catName = id => (CATEGORIAS.find(c=>c.id===id)||{}).nombre || "";
const catEmoji = id => (CATEGORIAS.find(c=>c.id===id)||{}).emoji || "✨";

/* Emoji de relleno cuando no hay foto */
function placeholder(p){ return catEmoji(p.categoria); }

/* Datos legales (con valores por defecto si faltan) */
function legalInfo(key){
  const l = CONFIG.legal || {};
  if(key==="plazoEntrega")  return l.plazoEntrega || "Entre 3 y 10 días hábiles según la zona.";
  if(key==="garantiaMeses") return (l.garantiaMeses!=null ? l.garantiaMeses : 6);
  return l[key] || "";
}

/* ============================ INICIO ============================ */
function init(){
  document.getElementById("brandName").textContent  = CONFIG.nombre;
  document.getElementById("footBrand").textContent  = CONFIG.nombre;
  document.getElementById("brandSlogan").textContent= CONFIG.eslogan;
  document.getElementById("heroTitle").textContent  = CONFIG.nombre;
  document.getElementById("heroText").textContent   = CONFIG.eslogan;
  document.title = CONFIG.nombre;
  if(CONFIG.envioTexto){ document.getElementById("shipText").textContent = CONFIG.envioTexto; }
  else { document.getElementById("shipBox").style.display="none"; }

  // contacto en el footer
  let fc = [];
  if(CONFIG.whatsapp) fc.push(`<a href="https://wa.me/${CONFIG.whatsapp}" target="_blank">💬 Escribinos por WhatsApp</a>`);
  if(CONFIG.instagram) fc.push(`<a href="${CONFIG.instagram}" target="_blank">📷 Instagram</a>`);
  document.getElementById("footContact").innerHTML = fc.join(" &nbsp;·&nbsp; ");

  renderCats();
  renderGrid();
  updateCartCount();
}

/* ============================ CATEGORÍAS ============================ */
function renderCats(){
  const el = document.getElementById("cats");
  let html = `<button class="cat ${activeCat==='todos'?'on':''}" onclick="setCat('todos')"><span class="em">🛍️</span>Todos</button>`;
  CATEGORIAS.forEach(c=>{
    const has = PRODUCTOS.some(p=>p.categoria===c.id);
    if(!has) return;
    html += `<button class="cat ${activeCat===c.id?'on':''}" onclick="setCat('${c.id}')"><span class="em">${c.emoji}</span>${c.nombre}</button>`;
  });
  el.innerHTML = html;
}
function setCat(id){ activeCat = id; renderCats(); renderGrid(); }

/* ============================ GRID ============================ */
function renderGrid(){
  const el = document.getElementById("grid");
  const list = PRODUCTOS.filter(p => activeCat==="todos" || p.categoria===activeCat);
  if(!list.length){ el.innerHTML = `<div class="empty"><div class="em">🍃</div><p>No hay productos en esta categoría todavía.</p></div>`; return; }
  el.innerHTML = list.map(p => {
    const img = p.foto ? `<img src="${p.foto}" alt="${escapeHtml(p.nombre)}" loading="lazy">` : `<div class="ph">${placeholder(p)}</div>`;
    let badge = "";
    if(soldOut(p)) badge = `<span class="badge out">Vendida</span>`;
    else if(p.destacado) badge = `<span class="badge">Destacado</span>`;
    let addBtn;
    if(soldOut(p))        addBtn = `<div class="add disabled">Vendida</div>`;
    else if(!hasPrice(p)) addBtn = `<button class="add" onclick="event.stopPropagation();consultar(${p.id})">💬 Consultar</button>`;
    else                  addBtn = `<button class="add" onclick="event.stopPropagation();addToCart(${p.id})">＋ Agregar</button>`;
    const unicaTag = p.unica ? `<div class="unica-tag">Pieza única · 1 de 1</div>` : "";
    return `
      <article class="card" onclick="openProduct(${p.id})">
        <div class="thumb">${img}${badge}</div>
        <div class="card-body">
          <div class="card-cat">${catName(p.categoria)}</div>
          <div class="card-name">${escapeHtml(p.nombre)}</div>
          ${unicaTag}
          <div class="card-price">${priceLabel(p)}</div>
          ${addBtn}
        </div>
      </article>`;
  }).join("");
}

/* ============================ DETALLE ============================ */
function openProduct(id){
  const p = byId(id); if(!p) return;
  const img = p.foto ? `<img src="${p.foto}" alt="${escapeHtml(p.nombre)}">` : placeholder(p);
  let badge = soldOut(p) ? `<span class="badge out" style="position:static;display:inline-block;margin-bottom:8px;">Vendida</span>`
            : p.destacado ? `<span class="badge" style="position:static;display:inline-block;margin-bottom:8px;">Destacado</span>` : "";
  let addBtn;
  if(soldOut(p))        addBtn = `<div class="btn btn-ghost" style="opacity:.6;">Pieza vendida</div>`;
  else if(!hasPrice(p)) addBtn = `<button class="btn btn-primary" onclick="consultar(${p.id})">💬 Consultar precio por WhatsApp</button>`;
  else                  addBtn = `<button class="btn btn-primary" onclick="addToCart(${p.id});closeAll();openCart();">🛒 Agregar al carrito</button>`;
  const unicaTag = p.unica ? `<span class="unica-tag" style="display:inline-block;margin-bottom:6px;">Pieza única · 1 de 1 · Raku</span>` : "";
  document.getElementById("prodSheet").innerHTML = `
    <div class="sheet-img">${img}<button class="x sheet-x" onclick="closeAll()" aria-label="Cerrar">✕</button></div>
    <div class="sheet-body">
      <div class="card-cat">${catName(p.categoria)}</div>
      <h2>${escapeHtml(p.nombre)}</h2>
      ${unicaTag}
      ${badge}
      <div class="sheet-price">${priceLabel(p)}</div>
      ${hasPrice(p) ? `<div class="iva-tag">Precio final</div>` : ""}
      <p class="sheet-desc">${escapeHtml(p.descripcion||"")}</p>
      <div class="prod-legal">
        <div>📦 <b>Entrega estimada:</b> ${escapeHtml(legalInfo("plazoEntrega"))}</div>
        <div>🔄 <b>Devoluciones:</b> tenés 10 días corridos desde que la recibís para arrepentirte, sin dar explicaciones. <a href="terminos-y-condiciones.html" target="_blank">Ver Términos</a></div>
        <div>✅ <b>Garantía legal:</b> ${escapeHtml(String(legalInfo("garantiaMeses")))} meses por defectos ocultos o de origen. Las características artesanales (craquelé, variaciones de color, textura y forma) no se consideran defectos. <a href="terminos-y-condiciones.html" target="_blank">Ver Términos</a></div>
      </div>
      ${addBtn}
    </div>`;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("prodModal").classList.add("show");
}

/* ============================ CARRITO ============================ */
function addToCart(id){
  const p = byId(id); if(!p || soldOut(p) || !hasPrice(p)) return;
  if(p.unica && (cart[id]||0) >= 1){ toast("Es una pieza única (1 de 1) 🌿"); return; }
  cart[id] = (cart[id]||0) + 1;
  saveCart(); updateCartCount(); toast(`✓ ${p.nombre} agregado`);
}
function changeQty(id, delta){
  const p = byId(id);
  if(delta > 0 && p && p.unica && (cart[id]||0) >= 1){ toast("Es una pieza única (1 de 1) 🌿"); return; }
  cart[id] = (cart[id]||0) + delta;
  if(cart[id] <= 0) delete cart[id];
  saveCart(); updateCartCount(); renderCart();
}
/* Consultar por WhatsApp una pieza sin precio publicado */
function consultar(id){
  const p = byId(id); if(!p) return;
  const txt = `¡Hola! Me interesa la pieza *${p.nombre}*. ¿Me podrías pasar el precio y si está disponible? ¡Gracias!`;
  window.open(waLink(txt), "_blank");
}
function removeItem(id){ delete cart[id]; saveCart(); updateCartCount(); renderCart(); }
function saveCart(){ localStorage.setItem("cart", JSON.stringify(cart)); }
function cartItems(){ return Object.keys(cart).map(id=>({p:byId(id),q:cart[id]})).filter(x=>x.p); }
function cartTotal(){ return cartItems().reduce((s,x)=>s + x.p.precio*x.q, 0); }
function cartQty(){ return cartItems().reduce((s,x)=>s + x.q, 0); }
function updateCartCount(){ document.getElementById("cartCount").textContent = cartQty(); }

function renderCart(){
  const body = document.getElementById("cartBody");
  const foot = document.getElementById("cartFoot");
  const items = cartItems();
  if(!items.length){
    body.innerHTML = `<div class="cart-empty"><div class="em">🛒</div><p style="margin-top:10px;">Tu carrito está vacío.</p><p style="font-size:14px;margin-top:6px;">Agregá productos para empezar.</p></div>`;
    foot.innerHTML = `<button class="btn btn-ghost" onclick="closeAll()">Seguir mirando</button>`;
    return;
  }
  body.innerHTML = items.map(({p,q})=>{
    const img = p.foto ? `<img src="${p.foto}" alt="">` : placeholder(p);
    return `
    <div class="ci">
      <div class="ci-thumb">${img}</div>
      <div class="ci-info">
        <div class="ci-name">${escapeHtml(p.nombre)}</div>
        <div class="ci-price">${money(p.precio)} c/u</div>
        <div class="qty">
          <button onclick="changeQty(${p.id},-1)" aria-label="Restar">−</button>
          <span>${q}</span>
          <button onclick="changeQty(${p.id},1)" aria-label="Sumar">＋</button>
        </div>
        <div class="ci-remove" onclick="removeItem(${p.id})">🗑 Quitar</div>
      </div>
      <div style="font-weight:800;white-space:nowrap;">${money(p.precio*q)}</div>
    </div>`;
  }).join("");
  foot.innerHTML = `
    <div class="totrow"><span class="lbl">Total</span><span class="val">${money(cartTotal())}</span></div>
    <button class="btn btn-primary" onclick="openCheckout()">Finalizar compra →</button>`;
}

/* ============================ CHECKOUT ============================ */
/* ── Envíos ── */
function shipOptions(){
  return (CONFIG.envios && CONFIG.envios.length) ? CONFIG.envios
       : [{ nombre:"A coordinar por WhatsApp", costo:null }];
}
function shipSel(){ return shipOptions()[selectedShip] || shipOptions()[0]; }
function shipIsTBD(){ const o=shipSel(); return !o || o.costo==null; }
function shipCost(){ const o=shipSel(); return (o && typeof o.costo==="number") ? o.costo : 0; }
function grandTotal(){ return cartTotal() + shipCost(); }
function setShip(i){ selectedShip = i; renderShipBlock(); }

function renderShipBlock(){
  const opts = shipOptions().map((o,i)=>{
    const costo = o.costo==null ? "a coordinar" : (o.costo===0 ? "sin cargo" : money(o.costo));
    return `<label class="ship-opt ${i===selectedShip?'on':''}">
      <input type="radio" name="ship" ${i===selectedShip?'checked':''} onchange="setShip(${i})">
      <span class="ship-name">${escapeHtml(o.nombre)}</span>
      <span class="ship-cost">${costo}</span>
    </label>`;
  }).join("");
  const totalTxt = shipIsTBD() ? `${money(cartTotal())} <small>+ envío</small>` : money(grandTotal());
  document.getElementById("shipBlock").innerHTML = `
    <div class="pay-title" style="margin-top:0;">Envío</div>
    <div class="ship-opts">${opts}</div>
    <div class="totbox">
      <div class="totline"><span>Productos</span><span>${money(cartTotal())}</span></div>
      <div class="totline"><span>Envío</span><span>${shipIsTBD() ? "a coordinar" : money(shipCost())}</span></div>
      <div class="totline grand"><span>Total</span><span>${totalTxt}</span></div>
    </div>`;
}

function openCheckout(){
  if(!cartItems().length) return;
  selectedShip = 0;
  const hasMP = !!(CONFIG.mercadoPagoLink && CONFIG.mercadoPagoLink.trim());
  const hasTransfer = !!(CONFIG.transferencia && CONFIG.transferencia.alias && CONFIG.transferencia.alias.trim() && CONFIG.transferencia.alias!=="TU.ALIAS.MP");

  let pays = `
    <button class="btn btn-wa" onclick="finish('whatsapp')">💬 Hacer el pedido por WhatsApp</button>`;
  if(hasMP) pays += `<button class="btn btn-mp" onclick="finish('mp')">💳 Pagar con tarjeta (Mercado Pago)</button>`;
  if(hasTransfer) pays += `<button class="btn btn-ghost" onclick="finish('transfer')">🏦 Pagar por transferencia</button>`;

  document.getElementById("checkoutBody").innerHTML = `
    <div id="shipBlock"></div>
    <p class="pay-sub">Completá tus datos para el envío.</p>
    <div class="field"><label>Tu nombre y apellido *</label><input id="ckNombre" type="text" placeholder="Ej: María González" autocomplete="name"></div>
    <div class="field"><label>Tu teléfono / WhatsApp *</label><input id="ckTel" type="tel" placeholder="Ej: 11 2233 4455" autocomplete="tel"></div>
    <div class="field"><label>Dirección y localidad de envío</label><input id="ckDir" type="text" placeholder="Calle, número, ciudad, provincia" autocomplete="street-address"></div>
    <div class="field"><label>¿Algo más que quieras aclarar?</label><textarea id="ckNota" placeholder="Comentarios sobre tu pedido (opcional)"></textarea></div>

    <div class="pay-title">¿Cómo querés pagar?</div>
    <p class="pay-sub">Elegí la opción que más te guste. Si tenés dudas, escribinos y te ayudamos.</p>
    ${pays}
    <div id="ckExtra"></div>
  `;
  renderShipBlock();
  document.getElementById("cartPanel").classList.remove("show");
  document.getElementById("overlay").classList.add("show");
  document.getElementById("checkoutPanel").classList.add("show");
}

function genOrderNum(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  const ymd = `${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}`;
  return `RN-${ymd}-${Math.floor(1000 + Math.random()*9000)}`;
}

function buildOrderText(orderNum){
  const items = cartItems();
  const datos = {
    nombre: (document.getElementById("ckNombre")||{}).value || "",
    tel:    (document.getElementById("ckTel")||{}).value || "",
    dir:    (document.getElementById("ckDir")||{}).value || "",
    nota:   (document.getElementById("ckNota")||{}).value || "",
  };
  let t = `*Nuevo pedido — ${CONFIG.nombre}*\n`;
  if(orderNum) t += `Orden Nº ${orderNum}\n`;
  t += `\n`;
  items.forEach(({p,q})=>{ t += `• ${q} x ${p.nombre} — ${money(p.precio*q)}\n`; });
  const o = shipSel();
  t += `\nProductos: ${money(cartTotal())}\n`;
  t += `Envío (${o.nombre}): ${shipIsTBD() ? "a coordinar" : money(shipCost())}\n`;
  t += shipIsTBD()
     ? `*Total: ${money(cartTotal())} + envío a coordinar*\n\n`
     : `*Total: ${money(grandTotal())}*\n\n`;
  if(datos.nombre) t += `👤 ${datos.nombre}\n`;
  if(datos.tel)    t += `📞 ${datos.tel}\n`;
  if(datos.dir)    t += `📍 ${datos.dir}\n`;
  if(datos.nota)   t += `📝 ${datos.nota}\n`;
  return {t, datos};
}

/* Arma el enlace de WhatsApp codificando el texto de forma segura,
   para que cualquier carácter que escriba el comprador no rompa ni
   se "cuele" en el enlace. */
function waLink(text){
  return `https://wa.me/${encodeURIComponent(CONFIG.whatsapp)}?text=` + encodeURIComponent(text);
}

function finish(method){
  // validación mínima
  const nombre = (document.getElementById("ckNombre")||{}).value.trim();
  const tel = (document.getElementById("ckTel")||{}).value.trim();
  if(!nombre || !tel){
    toast("Por favor completá tu nombre y teléfono");
    if(!nombre) document.getElementById("ckNombre").focus();
    else document.getElementById("ckTel").focus();
    return;
  }
  const orderNum = genOrderNum();
  const { t } = buildOrderText(orderNum);

  if(method==="whatsapp"){
    window.open(waLink(t), "_blank");
    showConfirmation(orderNum, t);
  }
  else if(method==="mp"){
    // Abrimos el link de pago de Mercado Pago y mandamos el detalle por WhatsApp
    window.open(CONFIG.mercadoPagoLink, "_blank");
    document.getElementById("ckExtra").innerHTML = `
      <div class="note">
        <b>Pago con tarjeta (Mercado Pago)</b> — Orden Nº <b>${orderNum}</b><br>
        Se abrió la página de pago en otra pestaña. Una vez que pagues, avisanos por WhatsApp con el comprobante para coordinar el envío.<br><br>
        <a class="btn btn-wa" href="${waLink(t + '\n\n(Pago con tarjeta por Mercado Pago)')}" target="_blank" style="margin-top:4px;">💬 Avisar el pago por WhatsApp</a>
      </div>
      ${arrepentimientoNota()}`;
    document.getElementById("ckExtra").scrollIntoView({behavior:"smooth",block:"center"});
  }
  else if(method==="transfer"){
    const tr = CONFIG.transferencia;
    document.getElementById("ckExtra").innerHTML = `
      <div class="note">
        <b>Datos para la transferencia</b> — Orden Nº <b>${orderNum}</b><br><br>
        Alias: <span class="copy">${tr.alias}</span><br>
        ${tr.cbu ? `CBU/CVU: <span class="copy">${tr.cbu}</span><br>`:""}
        ${tr.titular ? `Titular: <b>${tr.titular}</b><br>`:""}
        Monto: <span class="copy">${shipIsTBD() ? money(cartTotal())+" + envío (a coordinar)" : money(grandTotal())}</span><br><br>
        Cuando hagas la transferencia, mandanos el comprobante por WhatsApp y coordinamos el envío.<br><br>
        <a class="btn btn-wa" href="${waLink(t + '\n\n(Pago por transferencia)')}" target="_blank" style="margin-top:4px;">💬 Enviar comprobante por WhatsApp</a>
      </div>
      ${arrepentimientoNota()}`;
    document.getElementById("ckExtra").scrollIntoView({behavior:"smooth",block:"center"});
  }
}

/* Recordatorio del derecho de arrepentimiento (Ley 24.240) */
function arrepentimientoNota(){
  return `<div class="note" style="margin-top:10px;">
    <b>Tu derecho de arrepentimiento:</b> tenés 10 días corridos desde que recibís el
    producto para arrepentirte, sin dar explicaciones.
    <a href="boton-de-arrepentimiento.html" target="_blank">Más información</a>.
  </div>`;
}

/* Pantalla de confirmación de compra (Ley 24.240) */
function showConfirmation(orderNum, t){
  const email = legalInfo("email");
  const wa = CONFIG.whatsapp ? `<a href="https://wa.me/${encodeURIComponent(CONFIG.whatsapp)}" target="_blank">WhatsApp</a>` : "";
  const mail = email ? ` · <a href="mailto:${email}">${email}</a>` : "";
  document.getElementById("checkoutBody").innerHTML = `
    <div class="confirm">
      <div class="confirm-ic">✓</div>
      <h3>¡Gracias por tu pedido!</h3>
      <p>Te abrimos WhatsApp para confirmarlo. Si no se abrió,
         <a href="${waLink(t)}" target="_blank">tocá acá</a>.</p>
      <div class="confirm-num">Tu número de orden:<br><b>${orderNum}</b></div>
      ${arrepentimientoNota()}
      <div class="confirm-vendor">
        Vendedor: <b>${escapeHtml(legalInfo("titular") || CONFIG.nombre)}</b><br>
        Contacto: ${wa}${mail}
      </div>
      <button class="btn btn-primary" onclick="finishDone()">Seguir comprando</button>
    </div>`;
  document.getElementById("checkoutBody").scrollTop = 0;
}

function finishDone(){
  cart = {}; saveCart(); updateCartCount();
  closeAll(); renderGrid();
}

/* ============================ UI HELPERS ============================ */
function openCart(){ renderCart(); closePanels(); document.getElementById("overlay").classList.add("show"); document.getElementById("cartPanel").classList.add("show"); }
function closePanels(){
  document.getElementById("cartPanel").classList.remove("show");
  document.getElementById("checkoutPanel").classList.remove("show");
  document.getElementById("prodModal").classList.remove("show");
}
function closeAll(){ closePanels(); document.getElementById("overlay").classList.remove("show"); }
function scrollTop(){ window.scrollTo({top:0,behavior:"smooth"}); }

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2600);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeAll(); });

init();
</script>
</body>
</html>
