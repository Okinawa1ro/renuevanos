<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4a031">
<title>Audio Perceptiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060610;
  --bg2: #0c0c1e;
  --card: #11112a;
  --card2: #18183a;
  --gold: #d4a031;
  --gold2: #f0bf55;
  --orange: #dd5e22;
  --text: #f0ece0;
  --sub: #7a79a0;
  --ok: #38c96c;
  --err: #e03a3a;
  --border: #1e1e40;
  --border2: #2a2a50;
  --r: 16px;
  --r2: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);overflow-x:hidden;}
#root{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow:hidden;}
.screen{min-height:100vh;display:flex;flex-direction:column;padding-bottom:84px;}
.screen.no-nav{padding-bottom:0;}

/* HEADER */
.header{padding:52px 24px 20px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.logo-wrap{}
.logo{font-family:'Cinzel Decorative',serif;font-size:20px;background:linear-gradient(135deg,var(--gold) 0%,var(--orange) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px;}
.logo-sub{font-family:'Cinzel',serif;font-size:9px;letter-spacing:4px;color:var(--sub);text-transform:uppercase;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:8px;}
.streak-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(212,160,49,.12);border:1px solid rgba(212,160,49,.25);border-radius:50px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--gold);}
.back-btn{background:none;border:1px solid var(--border2);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);font-size:18px;transition:.2s;}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}

/* STAFF DECORATION */
.staff-deco{position:absolute;top:0;right:0;width:130px;height:90px;opacity:.05;pointer-events:none;}

/* SECTION TITLE */
.section-title{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;margin-bottom:12px;padding:0 24px;}

/* HOME - CATEGORY CARDS */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px;}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px 16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;text-align:left;}
.cat-card:active{transform:scale(.97);}
.cat-card:hover{border-color:var(--gold);background:var(--card2);}
.cat-card .cc-glow{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.08;filter:blur(20px);}
.cat-icon{font-size:32px;margin-bottom:10px;display:block;line-height:1;}
.cat-title{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.cat-desc{font-size:11px;color:var(--sub);line-height:1.4;}
.cat-count{position:absolute;top:12px;right:12px;background:var(--bg);border-radius:50px;padding:2px 8px;font-size:10px;color:var(--sub);border:1px solid var(--border);}

/* DIVIDER */
.divider{height:1px;background:var(--border);margin:20px 24px;}

/* QUICK STATS */
.quick-stats{display:flex;gap:8px;padding:0 20px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;}
.quick-stats::-webkit-scrollbar{display:none;}
.qs-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px;min-width:90px;text-align:center;flex-shrink:0;}
.qs-val{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--gold);}
.qs-label{font-size:10px;color:var(--sub);margin-top:2px;letter-spacing:.5px;}

/* CONFIG */
.config-body{padding:0 20px;flex:1;overflow-y:auto;}
.cfg-section{margin-bottom:24px;}
.cfg-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;margin-bottom:10px;}
.chips-wrap{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:8px 14px;border-radius:50px;border:1.5px solid var(--border);background:none;color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Nunito',sans-serif;white-space:nowrap;}
.chip:active{transform:scale(.95);}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(212,160,49,.1);}
.chip.danger.on{border-color:var(--err);color:var(--err);background:rgba(224,58,58,.1);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.trow-left{}
.trow-label{font-size:14px;font-weight:600;color:var(--text);}
.trow-sub{font-size:11px;color:var(--sub);margin-top:2px;}
.toggle{width:46px;height:26px;border-radius:13px;background:var(--border2);position:relative;cursor:pointer;transition:background .2s;border:none;flex-shrink:0;}
.toggle.on{background:var(--gold);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
.toggle.on::after{left:23px;}
.sel-wrap{position:relative;}
.sel-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none;font-size:13px;}
select.styled{background:var(--card2);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px;color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;width:100%;appearance:none;cursor:pointer;-webkit-appearance:none;}
.seg-control{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:var(--r2);padding:3px;gap:2px;}
.seg-btn{flex:1;padding:8px;border-radius:8px;border:none;background:none;color:var(--sub);font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.seg-btn.on{background:var(--gold);color:#000;}

/* CONFIG FOOTER */
.config-footer{padding:16px 20px 20px;border-top:1px solid var(--border);}

/* PRIMARY BUTTON */
.btn-primary{background:linear-gradient(135deg,var(--gold) 0%,var(--orange) 100%);color:#000;border:none;border-radius:50px;padding:16px 32px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;width:100%;transition:all .2s;letter-spacing:.3px;}
.btn-primary:active{transform:scale(.97);}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border2);border-radius:50px;padding:14px 28px;font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;cursor:pointer;width:100%;transition:all .2s;}
.btn-secondary:active{transform:scale(.97);}

/* EXERCISE */
.ex-header{padding:48px 24px 12px;display:flex;align-items:center;gap:12px;}
.ex-progress-wrap{flex:1;}
.ex-counter{font-size:11px;color:var(--sub);font-weight:600;margin-bottom:5px;font-family:'Cinzel',serif;letter-spacing:1px;}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:2px;transition:width .4s ease;}
.ex-type-badge{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;padding:4px 10px;border:1px solid var(--border);border-radius:50px;white-space:nowrap;}
.ex-play-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px 20px;gap:12px;}
.ex-prompt{font-family:'Cinzel',serif;font-size:13px;color:var(--sub);text-align:center;letter-spacing:1px;}
.note-display{font-family:'Cinzel Decorative',serif;font-size:22px;color:var(--gold);margin-bottom:4px;}
.play-btn{width:100px;height:100px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:40px;transition:all .3s;position:relative;background:linear-gradient(135deg,var(--gold) 0%,var(--orange) 100%);}
.play-btn::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--orange));opacity:.25;z-index:-1;transition:all .3s;}
.play-btn:active{transform:scale(.93);}
.play-btn.playing{animation:pulse-play 1.2s infinite;}
@keyframes pulse-play{
  0%,100%{box-shadow:0 0 0 0 rgba(212,160,49,.5);}
  50%{box-shadow:0 0 0 20px rgba(212,160,49,0);}
}
.play-label{font-size:11px;color:var(--sub);letter-spacing:1px;font-family:'Cinzel',serif;margin-top:4px;}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;}
.opt-btn{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:16px 12px;color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;min-height:64px;display:flex;align-items:center;justify-content:center;line-height:1.3;}
.opt-btn:hover:not(:disabled){border-color:var(--gold);background:var(--card2);}
.opt-btn:active:not(:disabled){transform:scale(.96);}
.opt-btn.correct{border-color:var(--ok);background:rgba(56,201,108,.12);color:var(--ok);}
.opt-btn.wrong{border-color:var(--err);background:rgba(224,58,58,.12);color:var(--err);}
.opt-btn.reveal{border-color:var(--ok);background:rgba(56,201,108,.08);color:var(--ok);}
.opt-btn:disabled{cursor:default;}
.feedback-bar{margin:16px 20px 0;padding:14px 18px;border-radius:var(--r);display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;}
.feedback-bar.ok{background:rgba(56,201,108,.1);border:1px solid rgba(56,201,108,.3);color:var(--ok);}
.feedback-bar.ko{background:rgba(224,58,58,.1);border:1px solid rgba(224,58,58,.3);color:var(--err);}
.feedback-icon{font-size:20px;}
.next-btn-wrap{padding:16px 20px 0;}

/* RESULTS */
.results-body{flex:1;padding:0 24px;display:flex;flex-direction:column;gap:20px;}
.score-circle-wrap{display:flex;justify-content:center;padding-top:8px;}
.score-circle{width:150px;height:150px;border-radius:50%;border-width:6px;border-style:solid;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-pct{font-family:'Cinzel',serif;font-size:42px;font-weight:700;line-height:1;}
.score-sub{font-size:11px;color:var(--sub);margin-top:2px;}
.stars{font-size:28px;letter-spacing:6px;text-align:center;}
.result-stat-row{display:flex;gap:10px;}
.rstat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;text-align:center;}
.rstat-val{font-family:'Cinzel',serif;font-size:24px;font-weight:700;}
.rstat-label{font-size:11px;color:var(--sub);margin-top:2px;}
.answers-review{}
.ar-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;margin-bottom:10px;}
.ar-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;}
.ar-item:last-child{border-bottom:none;}
.ar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ar-answer{color:var(--sub);font-size:11px;margin-top:2px;}
.results-actions{display:flex;flex-direction:column;gap:8px;padding-bottom:20px;}

/* AD PLACEHOLDER */
.ad-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:40px 24px;}
.ad-label{font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;}
.ad-box{width:100%;max-width:360px;height:280px;background:var(--card);border:1px dashed var(--border2);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sub);}
.ad-box-icon{font-size:36px;}
.ad-box-text{font-size:13px;font-weight:600;}
.ad-box-sub{font-size:11px;color:var(--border2);}
.ad-countdown{font-family:'Cinzel',serif;font-size:13px;color:var(--sub);}
.ad-banner{margin:0 20px;padding:12px;background:var(--card);border:1px dashed var(--border2);border-radius:var(--r2);display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;}
.ad-banner-txt{font-size:11px;color:var(--sub);}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(6,6,16,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;padding:10px 0 22px;z-index:200;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border:none;background:none;color:var(--sub);transition:color .2s;font-family:'Nunito',sans-serif;}
.nav-item.active{color:var(--gold);}
.nav-icon{font-size:22px;}
.nav-label{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}

/* STATS */
.stats-body{padding:0 20px;flex:1;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.stat-card-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.stat-card-icon{font-size:24px;}
.stat-card-title{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:var(--text);}
.stat-card-sub{font-size:11px;color:var(--sub);}
.stat-bar-wrap{margin-bottom:8px;}
.stat-bar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
.stat-bar-name{color:var(--sub);}
.stat-bar-pct{color:var(--gold);font-weight:700;}
.stat-bar-bg{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.stat-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:3px;transition:width .8s ease;}
.empty-stats{text-align:center;padding:60px 0;color:var(--sub);font-size:14px;}
.empty-icon{font-size:40px;margin-bottom:12px;display:block;}

/* ANIMATED DOT LOADER */
.dot-loader{display:flex;gap:6px;align-items:center;justify-content:center;padding:20px;}
.dot-loader span{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:dotbounce 1.2s infinite;}
.dot-loader span:nth-child(2){animation-delay:.2s;}
.dot-loader span:nth-child(3){animation-delay:.4s;}
@keyframes dotbounce{0%,80%,100%{transform:scale(0);opacity:.3;}40%{transform:scale(1);opacity:1;}}

/* RESPONSIVE */
@media(min-width:430px){#root{box-shadow:0 0 80px rgba(0,0,0,.5);}}

/* PRO / FREEMIUM */
.chip.locked{opacity:.45;cursor:pointer;position:relative;}
.chip.locked::after{content:'🔒';font-size:9px;margin-left:4px;}
.pro-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;font-size:10px;font-weight:800;padding:3px 9px;border-radius:50px;letter-spacing:.5px;font-family:'Nunito',sans-serif;}
.upgrade-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 24px 40px;}
.upgrade-hero{width:100%;text-align:center;padding:60px 0 28px;}
.upgrade-icon{font-size:56px;display:block;margin-bottom:12px;}
.upgrade-title{font-family:'Cinzel Decorative',serif;font-size:22px;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.upgrade-sub{font-size:13px;color:var(--sub);line-height:1.6;}
.upgrade-features{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:20px;}
.upgrade-feat{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);}
.upgrade-feat:last-child{border-bottom:none;}
.feat-icon{font-size:20px;flex-shrink:0;width:28px;text-align:center;}
.feat-text{}
.feat-title{font-size:13px;font-weight:700;color:var(--text);}
.feat-sub{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4;}
.price-card{width:100%;background:var(--card2);border:1.5px solid var(--gold);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px;}
.price-amount{font-family:'Cinzel',serif;font-size:36px;font-weight:700;color:var(--gold);}
.price-period{font-size:12px;color:var(--sub);}
.price-note{font-size:11px;color:var(--sub);margin-top:6px;}
.restore-btn{background:none;border:none;color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;font-family:'Nunito',sans-serif;padding:8px;}

</style>
</head>

<div id="root">
  <!-- Screens rendered by JS -->

<script>
/* ══════════════════════════════════════════════════
   AUDIO ENGINE — Web Audio API
══════════════════════════════════════════════════ */
let _ctx = null, _masterGain = null;
function getCtx(){
  if(!_ctx){
    _ctx=new(window.AudioContext||window.webkitAudioContext)();
    _masterGain=_ctx.createGain();
    _masterGain.gain.value=0.65;
    _masterGain.connect(_ctx.destination);
  }
  if(_ctx.state==='suspended')_ctx.resume();
  return _ctx;
}
function midiToFreq(m){return 440*Math.pow(2,(m-69)/12);}

function playNote(midi,startTime,duration=2.2){
  const ctx=getCtx(),freq=midiToFreq(midi);
  const g=ctx.createGain();
  g.connect(_masterGain);
  const a=0.005,d=0.25,s=0.35,r=Math.min(.9,duration*.35);
  g.gain.setValueAtTime(0,startTime);
  g.gain.linearRampToValueAtTime(.3,startTime+a);
  g.gain.exponentialRampToValueAtTime(.3*s,startTime+a+d);
  g.gain.setValueAtTime(.3*s,startTime+duration-r);
  g.gain.linearRampToValueAtTime(.001,startTime+duration);
  [[1,.9],[2,.35],[3,.12],[4,.05],[6,.02]].forEach(([h,amp])=>{
    const o=ctx.createOscillator(),hg=ctx.createGain();
    hg.gain.value=amp; o.type='sine'; o.frequency.value=freq*h;
    o.connect(hg); hg.connect(g);
    o.start(startTime); o.stop(startTime+duration+.05);
  });
}

function playChord(midis,arp=false,dur=2.5){
  const ctx=getCtx(),now=ctx.currentTime+.05;
  if(arp){
    // Always 4 strokes so the ear can't count notes to cheat.
    // Triads get root+octave as 4th stroke; 7ths play as-is.
    const padded=midis.length<4?[...midis,midis[0]+12]:midis;
    padded.forEach((m,i)=>playNote(m,now+i*.22,dur));
  }else{
    midis.forEach(m=>playNote(m,now,dur));
  }
}

function playScale(midis,speed=.44){
  const ctx=getCtx(),now=ctx.currentTime+.05;
  const all=[...midis,midis[0]+12];
  all.forEach((m,i)=>playNote(m,now+i*speed,speed+.35));
}

function playInterval(root,st,harmonic=true){
  const ctx=getCtx(),now=ctx.currentTime+.05;
  if(harmonic){playNote(root,now,2.8);playNote(root+st,now,2.8);}
  else{playNote(root,now,1.4);playNote(root+st,now+.9,1.4);}
}

/* ══════════════════════════════════════════════════
   MUSIC DATA
══════════════════════════════════════════════════ */
const NOTAS=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];

const INTERVALOS=[
  {n:'Unísono',st:0},{n:'2ª menor',st:1},{n:'2ª mayor',st:2},
  {n:'3ª menor',st:3},{n:'3ª mayor',st:4},{n:'4ª justa',st:5},
  {n:'Tritono',st:6},{n:'5ª justa',st:7},{n:'6ª menor',st:8},
  {n:'6ª mayor',st:9},{n:'7ª menor',st:10},{n:'7ª mayor',st:11},
  {n:'Octava',st:12}
];

const ACORDES=[
  {n:'Mayor',st:[0,4,7]},{n:'Menor',st:[0,3,7]},
  {n:'Aumentado',st:[0,4,8]},{n:'Disminuido',st:[0,3,6]},
  {n:'Dom. 7ª',st:[0,4,7,10]},{n:'Mayor 7ª',st:[0,4,7,11]},
  {n:'Menor 7ª',st:[0,3,7,10]},{n:'Dismin. 7ª',st:[0,3,6,9]},
  {n:'Semidismin.',st:[0,3,6,10]},{n:'Sus2',st:[0,2,7]},{n:'Sus4',st:[0,5,7]}
];

const ESCALAS=[
  {n:'Mayor',iv:[0,2,4,5,7,9,11]},{n:'Menor natural',iv:[0,2,3,5,7,8,10]},

/* ══════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════ */
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function getInversion(st,inv){
  if(!inv)return st;
  const r=[...st];
  for(let i=0;i<inv;i++){r.push(r.shift()+12);}
  return r;
}
function buildOpts(correct,selectedPool,fullPool,n=4){
  // Always pick distractors from the full category pool so exercises work
  // even with just 1 item selected. Selected pool is only for the correct answer.
  const distractorSrc=shuffle((fullPool||selectedPool).filter(x=>x!==correct));
  // Prefer distractors NOT in the selected set (more challenging), then fill from rest
  const notSelected=distractorSrc.filter(x=>!selectedPool.includes(x));
  const fromSelected=distractorSrc.filter(x=>selectedPool.includes(x)&&x!==correct);
  const distractors=[...notSelected,...fromSelected].slice(0,n-1);
  // If still not enough (tiny full pool), pad from selected
  return shuffle([correct,...distractors]);
}
function getRootMidi(cfg){
  const ton=cfg.tonality!==null?cfg.tonality:Math.floor(Math.random()*12);
  return 60+ton;
}
function pct(c,t){return t?Math.round((c/t)*100):0;}
function stars(p){
  if(p>=90)return'★★★';if(p>=70)return'★★☆';if(p>=50)return'★☆☆';return'☆☆☆';
}

/* ══════════════════════════════════════════════════
   EXERCISE GENERATION
══════════════════════════════════════════════════ */
function genExercise(type,cfg){
  const root=getRootMidi(cfg);
  const noteName=NOTAS[root%12];

  if(type==='intervalos'){
    const pool=INTERVALOS.filter(i=>cfg.selIntervals.includes(i.st));
    if(!pool.length)return null;
    const ch=pick(pool);
    const harm=cfg.intervalMode==='harmonic';
    const fullNames=INTERVALOS.map(i=>i.n);
    const selNames=pool.map(i=>i.n);
    return{
      type,root,noteName,correct:ch.n,
      options:buildOpts(ch.n,selNames,fullNames),
      play:()=>playInterval(root,ch.st,harm),
      detail:`${noteName} → ${NOTAS[(root+ch.st)%12]}`,
    };
  }

  if(type==='acordes'){
    const pool=ACORDES.filter(a=>cfg.selChords.includes(a.n));
    if(!pool.length)return null;
    const ch=pick(pool);
    const maxInv=Math.min(ch.st.length-1,cfg.maxInversion);
    const inv=Math.floor(Math.random()*(maxInv+1));
    const invSt=getInversion(ch.st,inv);
    const midis=invSt.map(s=>root+s);
    // Labels for selected pool (correct answer candidates)
    const selLabels=[];
    pool.forEach(a=>{
      for(let v=0;v<=Math.min(a.st.length-1,cfg.maxInversion);v++){
        selLabels.push(v?`${a.n} – ${v}ª inv.`:a.n);
      }
    });
    // Full label pool for distractors (all chord types)
    const fullLabels=[];
    ACORDES.forEach(a=>{
      for(let v=0;v<=Math.min(a.st.length-1,cfg.maxInversion);v++){
        fullLabels.push(v?`${a.n} – ${v}ª inv.`:a.n);
      }
    });
    const correct=inv?`${ch.n} – ${inv}ª inv.`:ch.n;
    return{
      type,root,noteName,correct,
      options:buildOpts(correct,selLabels,fullLabels),
      play:()=>playChord(midis,cfg.arpeggio),
      detail:noteName,
    };
  }

  if(type==='escalas'){
    const pool=ESCALAS.filter(e=>cfg.selScales.includes(e.n));
    if(!pool.length)return null;
    const ch=pick(pool);
    const midis=ch.iv.map(s=>root+s);
    const fullNames=ESCALAS.map(e=>e.n);
    const selNames=pool.map(e=>e.n);
    return{
      type,root,noteName,correct:ch.n,
      options:buildOpts(ch.n,selNames,fullNames),
      play:()=>playScale(midis),
      detail:noteName,
    };
  }

  if(type==='modos'){
    const pool=MODOS.filter(m=>cfg.selModes.includes(m.n));
    if(!pool.length)return null;
    const ch=pick(pool);
    const midis=ch.iv.map(s=>root+s);
    const fullNames=MODOS.map(m=>m.n);
    const selNames=pool.map(m=>m.n);
    return{
      type,root,noteName,correct:ch.n,
      options:buildOpts(ch.n,selNames,fullNames),
      play:()=>playScale(midis),
      detail:noteName,
    };
  }
  return null;
}

function startSession(type,cfg){
  const exs=[];
  for(let i=0;i<cfg.questionsN;i++){
    const ex=genExercise(type,cfg);
    if(ex)exs.push(ex);
  }
  if(!exs.length)return;
  state.session={exercises:exs,current:0,answers:[]};
  state.answered=false; state.selected=null;
  state.exType=type; state.screen='exercise';
  render();
  setTimeout(()=>{if(state.screen==='exercise')handlePlay();},500);
}

/* ══════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════ */
function handlePlay(){
  if(state.playing)return;
  const ex=state.session.exercises[state.session.current];
  if(!ex)return;
  state.playing=true; render();
  ex.play();
  setTimeout(()=>{state.playing=false;render();},3500);
}

function handleAnswer(opt){
  if(state.answered)return;
  const ex=state.session.exercises[state.session.current];
  const isOk=opt===ex.correct;
  state.selected=opt; state.answered=true;
  state.session.answers.push({correct:isOk,selected:opt,answer:ex.correct});
  // Update stats
  const k=state.exType;
  state.stats[k].correct+=isOk?1:0;
  state.stats[k].total+=1;
  state.stats[k].history.push(isOk?1:0);
  if(isOk)state.streak++;else state.streak=0;
  render();
}

function handleNext(){
  const nxt=state.session.current+1;
  if(nxt>=state.session.exercises.length){
    // Pro users skip ad entirely
    if(state.isPro){
      state.totalDone++; state.screen='results'; render();
    } else {
      state.screen='ad'; state.adCountdown=3; render();
      const t=setInterval(()=>{
        state.adCountdown--;
        if(state.adCountdown<=0){clearInterval(t);state.totalDone++;state.screen='results';render();}
        else render();
      },1000);
    }
  } else {
    state.session.current=nxt;
    state.answered=false; state.selected=null;
    render();
    setTimeout(()=>{if(state.screen==='exercise')handlePlay();},500);
  }
}

/* ══════════════════════════════════════════════════
   RENDER ENGINE
══════════════════════════════════════════════════ */
function render(){
  const root=document.getElementById('root');
  root.innerHTML='';

  // Sync navTab to screen for nav screens
  if(state.screen==='home')state.navTab='home';
  if(state.screen==='stats')state.navTab='stats';

  const {screen}=state;
  if(screen==='home')renderHome(root);
  else if(screen==='config')renderConfig(root);
  else if(screen==='exercise')renderExercise(root);
  else if(screen==='ad')renderAd(root);
  else if(screen==='results')renderResults(root);
  else if(screen==='stats')renderStats(root);
  else if(screen==='upgrade')renderUpgrade(root);
  else if(screen==='custom')renderCustomBuilder(root);

  // Bottom nav on home/stats
  if(screen==='home'||screen==='stats'){
    const nav=el('div',{id:'bottom-nav'},[
      navItem('🎵','Práctica',state.navTab==='home'),
      navItem('📊','Progreso',state.navTab==='stats'),
    ]);
    nav.children[0].onclick=()=>{state.navTab='home';state.screen='home';render();};
    nav.children[1].onclick=()=>{state.navTab='stats';state.screen='stats';render();};
    root.appendChild(nav);
  }
}

function cfgSelCount(){

let _toastTimeout=null;
function showToast(msg){
  let toast=document.getElementById('cfg-toast');
  if(!toast){
    toast=document.createElement('div');
    toast.id='cfg-toast';
    toast.style.cssText=`position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--err);color:#fff;
      padding:10px 20px;border-radius:50px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;
      z-index:999;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;`;
    document.getElementById('root').appendChild(toast);
  }
  toast.textContent=msg;
  toast.style.opacity='1';
  clearTimeout(_toastTimeout);
  _toastTimeout=setTimeout(()=>{toast.style.opacity='0';},1800);
}

function toggleRow(label,sub,value,onChange){
  const row=el('div',{class:'toggle-row'});
  const left=el('div',{class:'trow-left'},[
    el('div',{class:'trow-label'},[label]),
    sub?el('div',{class:'trow-sub'},[sub]):null,

function renderExercise(root){
  const sc=el('div',{class:'screen no-nav'});

  const ex=session.exercises[session.current];

  const progPct=((cur+(answered?1:0))/total)*100;

  // Header

  backBtn.onclick=()=>{state.screen='home';render();};

    el('div',{class:'ex-counter'},[`${cur+1} / ${total}`]),

    ]),
  ]);
  const badge=el('div',{class:'ex-type-badge'},[TYPE_LABELS[state.exType]||state.exType]);
  header.appendChild(backBtn);
  header.appendChild(progWrap);
  header.appendChild(badge);

  pz.appendChild(playBtn);
  pz.appendChild(el('div',{class:'play-label'},[playing?'Escuchando...':'Toca para escuchar']));
  sc.appendChild(pz);

  // Options
  const grid=el('div',{class:'options-grid'});
  ex.options.forEach(opt=>{
    let cls='opt-btn';
    if(answered){
      if(opt===ex.correct)cls+=' reveal';
      if(opt===selected&&selected!==ex.correct)cls+=' wrong';
    }
    const btn=el('button',{class:cls,disabled:answered?'true':null},[opt]);
    if(!answered)btn.onclick=()=>handleAnswer(opt);
    grid.appendChild(btn);
  });

    const isOk=selected===ex.correct;

    nextWrap.appendChild(nextBtn);

function buildSparkline(history){
  const w=280,h=40,n=Math.min(history.length,30);
  const data=history.slice(-n);
  const step=w/Math.max(data.length-1,1);
  let path='';
  data.forEach((v,i)=>{
    const x=i*step;
    const y=v?10:30;
    path+=(i===0?'M':'L')+`${x},${y} `;
  });
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.style.cssText='width:100%;height:40px;margin-top:10px;';
  const polyline=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  const pts=data.map((v,i)=>`${i*step},${v?10:30}`).join(' ');
  polyline.setAttribute('points',pts);
  polyline.setAttribute('fill','none');
  polyline.setAttribute('stroke','var(--gold)');
  polyline.setAttribute('stroke-width','2');
  polyline.setAttribute('stroke-linecap','round');
  polyline.setAttribute('stroke-linejoin','round');
  svg.appendChild(polyline);
  // dots
  data.forEach((v,i)=>{
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',i*step);
    circle.setAttribute('cy',v?10:30);
    circle.setAttribute('r','3');
    circle.setAttribute('fill',v?'var(--ok)':'var(--err)');
    svg.appendChild(circle);
  });
  return svg;
}

function renderCustomEditor(root,sc,body){

  const set=state.editingSet;

  const header=el('div',{class:'header'});
  const backBtn=el('button',{class:'back-btn'},['←']);
  backBtn.onclick=()=>{state.editingSet=null;state.screen='custom';render();};
  header.innerHTML=`<div class="logo" style="font-size:15px">✏️ ${set.idx>=0?'Editar':'Nuevo'} ejercicio</div>`;
  header.prepend(backBtn);
  esc.appendChild(header);

  const bd=el('div',{class:'config-body'});

  // Name
  bd.appendChild(cfgSection('Nombre del ejercicio',null,()=>{
    const inp=document.createElement('input');
    inp.type='text';
    inp.value=set.name;
    inp.style.cssText=`width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--r2);
      padding:12px 16px;color:var(--text);font-family:Nunito,sans-serif;font-size:14px;`;
    inp.oninput=()=>{set.name=inp.value;};
    return inp;
  }));

  // Type selector
  bd.appendChild(cfgSection('Tipo de contenido',null,()=>{
    const seg=el('div',{class:'seg-control'});
    ['intervalos','acordes','escalas','modos'].forEach(t=>{
      const labels={intervalos:'Intervalos',acordes:'Acordes',escalas:'Escalas',modos:'Modos'};
      const btn=el('button',{class:`seg-btn${set.type===t?' on':''}`},[labels[t]]);
      btn.onclick=()=>{set.type=t;set.items=[];renderCustomEditor(root,esc,bd);};
      seg.appendChild(btn);
    });
    return seg;
  }));

  // Item picker based on type
  const pools={
    intervalos:INTERVALOS.map(i=>i.n),
    acordes:ACORDES.map(a=>a.n),
    escalas:ESCALAS.map(e=>e.n),
    modos:MODOS.map(m=>m.n),
  };
  bd.appendChild(cfgSection('Elementos a incluir','Elegí qué querés practicar en este set',()=>{
    const wrap=el('div',{class:'chips-wrap'});
    pools[set.type].forEach(name=>{
      const on=set.items.includes(name);
      const chip=el('button',{class:`chip${on?' on':''}`},[name]);
      chip.onclick=()=>{
        const i=set.items.indexOf(name);
        if(i>=0)set.items.splice(i,1);else set.items.push(name);
        chip.className=`chip${set.items.includes(name)?' on':''}`;
      };
      wrap.appendChild(chip);
    });
    return wrap;
  }));

  // Questions count
  bd.appendChild(cfgSection('Preguntas por sesión',null,()=>{
    const seg=el('div',{class:'seg-control'});
    [5,10,15,20].forEach(n=>{
      const btn=el('button',{class:`seg-btn${set.questionsN===n?' on':''}`},[String(n)]);
      btn.onclick=()=>{set.questionsN=n;renderCustomEditor(root,esc,bd);};
      seg.appendChild(btn);
    });
    return seg;
  }));

  esc.appendChild(bd);

  // Footer
  const footer=el('div',{class:'config-footer'});
  const saveBtn=el('button',{class:'btn-primary'},['💾  Guardar ejercicio']);
  saveBtn.onclick=()=>{
    if(set.items.length<2){showToast('Elegí al menos 2 elementos');return;}
    if(!set.name.trim()){showToast('Poné un nombre al ejercicio');return;}
    const saved={name:set.name,type:set.type,items:[...set.items],questionsN:set.questionsN};
    if(set.idx>=0)state.customSets[set.idx]=saved;
    else state.customSets.push(saved);
    state.editingSet=null;
    showToast('Ejercicio guardado ✓');
    state.screen='custom';render();
  };
  footer.appendChild(saveBtn);
  esc.appendChild(footer);
  root.appendChild(esc);
}

function startCustomSession(set){
  // Build exercises from the custom set
  const exs=[];
  const pools={
    intervalos:()=>{
      const pool=INTERVALOS.filter(i=>set.items.includes(i.n));
      const full=INTERVALOS;
      const ch=pick(pool);
      const root2=getRootMidi(state.cfg);
      return{
        type:'custom',root:root2,noteName:NOTAS[root2%12],correct:ch.n,
        options:buildOpts(ch.n,pool.map(i=>i.n),full.map(i=>i.n)),
        play:()=>playInterval(root2,ch.st,true),
      };
    },
    acordes:()=>{
      const pool=ACORDES.filter(a=>set.items.includes(a.n));
      const full=ACORDES;
      const ch=pick(pool);
      const root2=getRootMidi(state.cfg);
      const midis=ch.st.map(s=>root2+s);
      const selL=pool.map(a=>a.n);
      const fullL=full.map(a=>a.n);
      return{
        type:'custom',root:root2,noteName:NOTAS[root2%12],correct:ch.n,
        options:buildOpts(ch.n,selL,fullL),
        play:()=>playChord(midis,true),
      };
    },
    escalas:()=>{
      const pool=ESCALAS.filter(e=>set.items.includes(e.n));
      const full=ESCALAS;
      const ch=pick(pool);
      const root2=getRootMidi(state.cfg);
      return{
        type:'custom',root:root2,noteName:NOTAS[root2%12],correct:ch.n,
        options:buildOpts(ch.n,pool.map(e=>e.n),full.map(e=>e.n)),
        play:()=>playScale(ch.iv.map(s=>root2+s)),
      };
    },
    modos:()=>{
      const pool=MODOS.filter(m=>set.items.includes(m.n));
      const full=MODOS;
      const ch=pick(pool);
      const root2=getRootMidi(state.cfg);
      return{
        type:'custom',root:root2,noteName:NOTAS[root2%12],correct:ch.n,
        options:buildOpts(ch.n,pool.map(m=>m.n),full.map(m=>m.n)),
        play:()=>playScale(ch.iv.map(s=>root2+s)),
      };
    },
  };
  for(let i=0;i<set.questionsN;i++){
    const ex=pools[set.type]();
    if(ex)exs.push(ex);
  }
  if(!exs.length)return;
  state.session={exercises:exs,current:0,answers:[]};
  state.answered=false;state.selected=null;
  state.exType='custom';state.screen='exercise';render();
  setTimeout(()=>{if(state.screen==='exercise')handlePlay();},500);
}

/* ══════════════════════════════════════════════════
   DOM HELPER
══════════════════════════════════════════════════ */
function el(tag,attrs,children){
  const d=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(v===null||v===undefined)return;
    if(k==='class')d.className=v;
    else if(k==='style')d.style.cssText=v;
    else if(k==='disabled')d.disabled=true;
    else d.setAttribute(k,v);
  });
  if(children)children.forEach(c=>{
    if(!c&&c!==0)return;
    if(typeof c==='string'||typeof c==='number')d.appendChild(document.createTextNode(String(c)));
    else d.appendChild(c);
  });
  return d;
}

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
render();
